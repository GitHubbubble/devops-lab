name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
  
    steps:
      - name: Check out respository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest -v 

      - name: Build Docker image
        run: docker build -t devops-lab:ci .

      - name: Run container
        run: |
          docker run -d \
            --name devops-lab-ci \
            -p 18080:8080 \
            devops-lab:ci
       
      - name: Inspect container
        if: always()
        run: |
          docker ps -a
          docker logs devops-lab-ci
          docker inspect devops-lab-ci

      - name: Smoke test
        run: |
          set -e

          #WAIT AND SEE
          if ! curl --silent --fail http://localhost:18080/healthz; then
            echo "No good, lets wait"
            sleep 5
          fi
 
          if ! curl --silent --fail http://localhost:18080/healthz; then
            echo "Still no good.. wait some more..."
            sleep 5
          fi

          if ! curl --silent --fail http://localhost:18080/healthz; then
            iecho "Hmm, this doesn't look good..."
            sleep 5
          fi


          curl --fail http://localhost:18080/
          curl --fail http://localhost:18080/healthz
          curl --fail http://localhost:18080/readyz

          status=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:18080/DNE)
   
          test "$status" = "404"

      - name: Log into GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Tag image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag devops-lab:ci "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Push image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Container logs
        if: failure()
        run: docker logs devops-lab-ci

      - name: Cleanup
        if: always()
        run: docker rm -f devops-lab-ci || true

